services:
  sentinel:
    build: .
    container_name: sentinel
    pid: "host"
    restart: unless-stopped
    read_only: true
    init: true

    expose:
      - "8000"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

    environment:
      - PORT=8000
      - DB_PATH=/data/metrics.db

      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ROOT=/host/root

      - ADMIN_LOGIN
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - ADMIN_NAME
      - AUTH_COOKIE_SECURE
      - AUTH_SESSION_TTL
      - AUTH_ALLOWED_ORIGINS
      - TRUST_PROXY_HEADERS
      - NETWORK_INTERFACES

      - CONTAINER_METRICS_ENABLED
      - CONTAINER_COLLECTION_INTERVAL=${CONTAINER_COLLECTION_INTERVAL:-30s}
      - CONTAINER_API_URL
      - DOCKER_SOCKET

      - SYSTEMD_UNITS
      - SYSTEMD_LOG_LINES

      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - TELEGRAM_TIMEZONE=${TELEGRAM_TIMEZONE:-Europe/Istanbul}
      # An explicitly empty value disables summaries; an unset value uses defaults.
      - TELEGRAM_SUMMARY_TIMES=${TELEGRAM_SUMMARY_TIMES-09:00,15:00,21:00}
      - TELEGRAM_ALERT_HOLD
      - TELEGRAM_RECOVERY_MARGIN
      - TELEGRAM_CPU_WARNING
      - TELEGRAM_CPU_MULTIPLIER
      - TELEGRAM_CPU_WARNING_HOLD
      - TELEGRAM_CPU_CRITICAL
      - TELEGRAM_CPU_CRITICAL_HOLD
      - TELEGRAM_CPU_RECOVERY
      - TELEGRAM_CPU_RECOVERY_HOLD
      - TELEGRAM_BRUTE_WINDOW
      - TELEGRAM_BRUTE_THRESHOLD
      - TELEGRAM_SSH_ENABLED

    volumes:
      - ./data:/data

      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

      - /var/run/docker.sock:/var/run/docker.sock

      # Host systemd runtime
      - /run/systemd:/run/systemd:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro

    tmpfs:
      - /tmp:size=16m,mode=1777

    networks:
      - infra_net

    group_add:
      - "${DOCKER_GID}"

networks:
  infra_net:
    external: true
